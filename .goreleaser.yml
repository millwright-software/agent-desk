# GoReleaser configuration
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-desk
    main: ./cmd/agent-desk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: millwright-software
    name: agent-desk
  draft: false
  prerelease: auto
  mode: append
  name_template: "v{{.Version}}"
  header: |
    ## Agent Desk v{{.Version}}

    Terminal session manager for AI coding agents.

    ### Installation

    **Homebrew (recommended):**
    ```bash
    brew install millwright-software/tap/agent-desk
    ```

    **Quick Install:**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/millwright-software/agent-desk/main/install.sh | bash
    ```

    **Go Install:**
    ```bash
    go install github.com/millwright-software/agent-desk/cmd/agent-desk@v{{.Version}}
    ```
  footer: |
    ---

    **Full Changelog**: https://github.com/millwright-software/agent-desk/compare/{{ .PreviousTag }}...{{ .Tag }}

# `brews:` was removed in goreleaser 2.x — `goreleaser check` fails on it, which
# means the config cannot be validated before a release. Casks are the supported
# path for a distributed binary.
homebrew_casks:
  - name: agent-desk
    repository:
      owner: millwright-software
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/millwright-software/agent-desk"
    description: "Terminal session manager for AI coding agents"
